tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieve a list of contacts for the authenticated user with optional pagination, sorting, and filtering.
security:
  - bearerAuth: []

parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
      example: 1
    description: Page number for pagination
  - in: query
    name: perPage
    required: false
    schema:
      type: integer
      example: 10
    description: Number of contacts per page
  - in: query
    name: sortBy
    required: false
    schema:
      type: string
      example: name
    description: Field to sort by (e.g. name, email, createdAt)
  - in: query
    name: sortOrder
    required: false
    schema:
      type: string
      enum: [asc, desc]
      example: asc
    description: Sort order
  - in: query
    name: isFavourite
    required: false
    schema:
      type: boolean
      example: true
    description: Filter by favourite status
  - in: query
    name: contactType
    required: false
    schema:
      type: string
      enum: ['work', 'home', 'personal']
      example: work
    description: Filter by contact type

responses:
  '200':
    description: Successfully retrieved contacts list
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - contacts
                - page
                - perPage
                - totalItems
                - totalPages
              properties:
                contacts:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 42
                totalPages:
                  type: integer
                  example: 5
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
