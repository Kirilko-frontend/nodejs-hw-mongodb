tags:
  - Contacts
summary: Delete contact
operationId: deleteContact
description: Delete an existing contact by its ID.
security:
  - bearerAuth: []

parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: 689c99e21075db3329e2da05
    description: The ID of the contact to delete

responses:
  '200':
    description: Successfully deleted contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully deleted contact!
            data:
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../../components/responses/500.yaml
