tags:
  - Contacts
summary: Update contact partially
operationId: patchContact
description: Update specific fields of an existing contact. Allows updating text fields and/or uploading a new photo.
security:
  - bearerAuth: []

parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: 689c99e21075db3329e2da05
    description: The ID of the contact to update

requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Contact name
            example: John Smith
          phoneNumber:
            type: string
            description: Contact phone number
            example: +380661234567
          email:
            type: string
            description: Contact email
            example: john@example.com
          contactType:
            type: string
            description: Contact type
            enum: ['work', 'home', 'personal']
            example: home
          isFavourite:
            type: boolean
            description: Contact favourite status
            example: true
          photo:
            type: string
            format: binary
            description: Contact photo file

responses:
  '200':
    description: Successfully patched contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../../components/responses/500.yaml
